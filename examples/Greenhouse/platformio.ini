; Greenhouse demo for ESP32WebDash.
; Inside the library repo it uses the library from ../.. ; in your own project use the GitHub line instead.

[platformio]
default_envs = esp32s3

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
lib_deps =
    symlink://../..
    ; https://github.com/zone11/ESP32WebDash.git#v0.1.3

; ESP32-S3 N16R8 (16 MB flash, 8 MB octal PSRAM)
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = ../../partitions/esp32-16MB.csv
build_flags = -DBOARD_HAS_PSRAM

; Classic ESP32 dev board with 4 MB flash
[env:esp32dev]
board = esp32dev
board_build.partitions = ../../partitions/esp32-4MB.csv
